<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>慢读 · 找一本书，开始读</title><link rel="stylesheet" href="/style.css"></head><body><header><a href="/">慢读 SLOWREAD</a><span>找到一本书，读进它的世界</span></header><main><section id="library"><p class="eyebrow">READ IN YOUR LANGUAGE</p><h1>想读哪一本？</h1><p class="muted">搜索书名或作者，先从可阅读的经典作品开始。</p><form id="search"><input id="query" aria-label="书名或作者" placeholder="傲慢与偏见、Jane Austen…" maxlength="200"><button>搜索</button></form><p id="libraryStatus" role="status"></p><div id="books" class="books"></div><p class="muted note">搜索经典作品 → 自动获取原文 → 整理章节。傲慢与偏见第一章含中文试读；其他章节显示原文。</p></section><section id="detail" hidden><button id="back">← 返回书库</button><p class="eyebrow" id="author"></p><h1 id="title"></h1><p id="description"></p><div id="chapters"></div><p id="source" class="note"></p></section><section id="reading" hidden><button id="toc">← 章节目录</button><h1 id="chapterTitle"></h1><div class="tools"><label><input type="checkbox" id="compare" role="switch">显示原文对照</label><button id="share">分享阅读位置</button></div><p id="readingStatus" role="status"></p><article id="text"></article><button id="done">本章读完</button><p class="note">有中文译文的章节使用AI辅助试读稿；暂无译文时显示原文。进度只保存在当前浏览器。</p></section></main><footer>原文、译文与页面独立管理 · 免费试读</footer><script type="module" src="/app.js"></script></body></html>
